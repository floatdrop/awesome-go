name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  validate:
    name: Validate entries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: awesome.json is in canonical form
        run: go run ./cmd/awesome fmt -check

      - name: Entry rules (offline)
        run: go run ./cmd/awesome validate

      - name: Generated files were not edited by hand
        if: github.event_name == 'pull_request'
        run: |
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- README.md metadata.json badges/)
          if [ -n "$changed" ]; then
            echo "::error::These files are generated from awesome.json; do not edit them in a pull request:"
            echo "$changed"
            exit 1
          fi

      - name: Repository checks on GitHub (new and changed entries only)
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git show "origin/${{ github.base_ref }}:awesome.json" > "$RUNNER_TEMP/base.json"
          go run ./cmd/awesome validate -remote -base "$RUNNER_TEMP/base.json"
